<svg width="120" height="70" viewBox="0 0 120 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Coffee Table - Top-down view (oval, black) -->
  <!-- Main table top -->
  <ellipse cx="60" cy="35" rx="55" ry="30" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Inner highlight to show surface -->
  <ellipse cx="60" cy="35" rx="48" ry="25" fill="none" stroke="#404040" stroke-width="1" opacity="0.3"/>
  <!-- Legs positions (small circles at corners) -->
  <circle cx="25" cy="20" r="3" fill="#1A1A1A"/>
  <circle cx="95" cy="20" r="3" fill="#1A1A1A"/>
  <circle cx="25" cy="50" r="3" fill="#1A1A1A"/>
  <circle cx="95" cy="50" r="3" fill="#1A1A1A"/>
</svg>
