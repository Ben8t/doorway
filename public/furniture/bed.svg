<svg width="150" height="200" viewBox="0 0 150 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bed - Top-down view -->
  <!-- Mattress -->
  <rect x="10" y="30" width="130" height="160" fill="#E8D5C4" stroke="#C4A57B" stroke-width="2" rx="3"/>
  <!-- Headboard -->
  <rect x="5" y="10" width="140" height="25" fill="#8B4513" stroke="#654321" stroke-width="2" rx="2"/>
  <!-- Pillows -->
  <rect x="20" y="40" width="50" height="30" fill="#F5E6D3" stroke="#D4C5B4" stroke-width="1" rx="2"/>
  <rect x="80" y="40" width="50" height="30" fill="#F5E6D3" stroke="#D4C5B4" stroke-width="1" rx="2"/>
  <!-- Blanket outline -->
  <rect x="25" y="80" width="100" height="100" fill="none" stroke="#C4A57B" stroke-width="1" stroke-dasharray="4 2" rx="2"/>
</svg>
