<svg width="100" height="40" viewBox="0 0 100 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bookshelf - True top-down view (just the depth of the furniture) -->
  <!-- Main body (depth of bookshelf) -->
  <rect x="5" y="5" width="90" height="30" fill="#A0522D" stroke="#654321" stroke-width="2" rx="2"/>
  <!-- Side panels (darker) -->
  <rect x="5" y="5" width="8" height="30" fill="#654321" stroke="#4A2F1A" stroke-width="1"/>
  <rect x="87" y="5" width="8" height="30" fill="#654321" stroke="#4A2F1A" stroke-width="1"/>
  <!-- Shelves divisions (light lines showing internal structure) -->
  <line x1="15" y1="13" x2="85" y2="13" stroke="#8B4513" stroke-width="1"/>
  <line x1="15" y1="20" x2="85" y2="20" stroke="#8B4513" stroke-width="1"/>
  <line x1="15" y1="27" x2="85" y2="27" stroke="#8B4513" stroke-width="1"/>
</svg>
